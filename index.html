<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta
      name="google-site-verification"
      content="0OVE3HPtHsAZYvua8ZLX4alNQKW02vRroH0zgpTm2jw"
    />
    <script>
      /* Set the saved theme before first paint to avoid a flash */
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("aimaura-theme") || "dark";
      } catch (e) {}
    </script>
    <!--

      scripts/prerender.mjs at build time. The values below are the homepage
      defaults so the dev server and an un-prerendered build still work.
    -->

    <title>AIMAURA | Best Interior Design Company in Dubai</title>
    <meta
      name="description"

    />
    <link rel="canonical" href="https://aimaura.ae/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aimaura" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="AIMAURA | Best Interior Design Company in Dubai"
    />
    <meta
      property="og:description"
      content="Top-rated interior companies in Dubai offering interior design, architecture consultant &amp; landscape architecture design services for stunning, modern spaces"
    />
    <meta property="og:url" content="https://aimaura.ae/" />
    <meta property="og:image" content="https://aimaura.ae/aimaura-brand.jpeg" />

    <meta property="og:image:height" content="556" />

      content="Aimaura — design-and-build studio in Dubai"
    />
    <!-- seo:end -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap"
